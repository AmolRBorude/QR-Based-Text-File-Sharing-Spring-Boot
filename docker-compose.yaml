services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: quickshare
      MYSQL_USER: root
      MYSQL_PASSWORD: root@12345
      MYSQL_ROOT_PASSWORD: root@12345
    ports: ["3308:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${root@12345} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/quickshare
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root@12345
      APP_UPLOAD_DIR: /app/uploads
    ports: ["8080:8080"]
    volumes: [shared_files:/app/uploads]
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  mysql_data:
  shared_files:
